<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <g id="kid-face">
      <circle cx="30" cy="30" r="20" fill="#FFD9E8" />
      <circle cx="22" cy="26" r="3" fill="#1F2937" />
      <circle cx="38" cy="26" r="3" fill="#1F2937" />
      <path d="M20 36 Q30 44 40 36" stroke="#1F2937" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <g id="star">
      <polygon points="0,8 3,3 8,0 3,-3 0,-8 -3,-3 -8,0 -3,3" fill="#FFF1A8" transform="scale(1.6)" />
    </g>

    <g id="balloon">
      <ellipse cx="0" cy="0" rx="12" ry="16" fill="#BFE9FF" />
      <path d="M0,16 L0,30" stroke="#7EC8FF" stroke-width="1.5" />
    </g>
  </defs>

  <rect width="100%" height="100%" fill="none" />

  <!-- pattern placement -->
  <use href="#kid-face" x="20" y="30" opacity="0.95" />
  <use href="#kid-face" x="140" y="20" opacity="0.95" transform="scale(0.9)" />
  <use href="#kid-face" x="70" y="140" opacity="0.9" transform="scale(0.85)" />

  <use href="#star" x="200" y="60" opacity="0.9" />
  <use href="#star" x="40" y="200" opacity="0.9" transform="scale(0.9)" />

  <use href="#balloon" x="190" y="180" opacity="0.8" />
  <use href="#balloon" x="30" y="120" opacity="0.8" transform="scale(0.9)" />
</svg>
